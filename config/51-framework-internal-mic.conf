# Framework Laptop 13 Ryzen AI 5 340: ALC285 capture works; ACP PDM clips.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.vendor.id = "0x1022"
        device.product.id = "0x15e3"
      }
    ]
    actions = {
      update-props = {
        api.alsa.use-ucm = false
        # 25% on the cubic UI scale. Saved user levels take precedence.
        device.routes.default-source-volume = 0.015625
      }
    }
  }
  {
    matches = [
      { api.alsa.card.name = "acp-pdm-mach" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
